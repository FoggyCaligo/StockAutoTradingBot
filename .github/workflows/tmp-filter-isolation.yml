name: tmp-filter-isolation

on:
  push:
    branches:
      - tmp-filter-isolation

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Rebuild replay DB
        run: |
          python Daily_bot/backtest/replay_market_traces.py \
            --db Daily_bot/rebuild_from_logs.sqlite3 \
            --logs-dir Daily_bot/logs
      - name: Baseline
        run: |
          python -m Daily_bot.backtest.replay_dynamic_expect_debounce_no_refill \
            --db Daily_bot/backtest/cache/rebuild_from_logs_replay_from_logs.sqlite3 \
            --dynamic-expect-stop-threshold -0.1 \
            --dynamic-expect-stop-consecutive 3 \
            --out Daily_bot/backtest/results/isolate_baseline.csv
      - name: Remove top ratio only
        run: |
          python -m Daily_bot.backtest.replay_dynamic_expect_debounce_no_refill \
            --db Daily_bot/backtest/cache/rebuild_from_logs_replay_from_logs.sqlite3 \
            --dynamic-expect-stop-threshold -0.1 \
            --dynamic-expect-stop-consecutive 3 \
            --top-ratio 1.0 \
            --out Daily_bot/backtest/results/isolate_no_top.csv
      - name: Remove prev-day cap only
        run: |
          python -m Daily_bot.backtest.replay_dynamic_expect_debounce_no_refill \
            --db Daily_bot/backtest/cache/rebuild_from_logs_replay_from_logs.sqlite3 \
            --dynamic-expect-stop-threshold -0.1 \
            --dynamic-expect-stop-consecutive 3 \
            --max-prev-day-change 0.0 \
            --out Daily_bot/backtest/results/isolate_no_prevday_cap.csv
      - name: Remove both
        run: |
          python -m Daily_bot.backtest.replay_dynamic_expect_debounce_no_refill \
            --db Daily_bot/backtest/cache/rebuild_from_logs_replay_from_logs.sqlite3 \
            --dynamic-expect-stop-threshold -0.1 \
            --dynamic-expect-stop-consecutive 3 \
            --top-ratio 1.0 \
            --max-prev-day-change 0.0 \
            --out Daily_bot/backtest/results/isolate_no_both.csv
      - name: Print comparison
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          from statistics import mean, median
          base = Path('Daily_bot/backtest/results')
          def s(name):
              tp = base / f'{name}.csv'
              dp = base / f'{name}_daily_rev.csv'
              with open(tp, encoding='utf-8-sig', newline='') as f: rows=list(csv.DictReader(f))
              with open(dp, encoding='utf-8-sig', newline='') as f: daily=list(csv.DictReader(f))
              pnls=[float(r['pnl_percent']) for r in rows]
              wins=sum(x>0 for x in pnls)
              profit=sum(int(float(r['total_profit_krw'])) for r in daily)
              dr=[float(r['total_return_percent_on_starting_capital']) for r in daily]
              reasons={}
              for r in rows: reasons[r['exit_reason']]=reasons.get(r['exit_reason'],0)+1
              print(f'=== {name} ===')
              print(f'trades={len(rows)} wins={wins} losses={len(rows)-wins} win_rate={wins/len(rows)*100:.4f}%')
              print(f'avg_pnl={mean(pnls):.6f}% median_pnl={median(pnls):.6f}% sum_pnl={sum(pnls):.6f}%')
              print(f'best={max(pnls):.6f}% worst={min(pnls):.6f}%')
              print(f'total_profit_krw={profit}')
              print(f'sum_daily_start_return={sum(dr):.6f}% avg_daily_start_return={mean(dr):.6f}%')
              print('exit_reasons=' + ','.join(f'{k}:{v}' for k,v in sorted(reasons.items())))
          for name in ['isolate_baseline','isolate_no_top','isolate_no_prevday_cap','isolate_no_both']:
              s(name)
          PY
