name: Temporary entry anchor A B
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp_run_entry_anchor_ab.yml'
permissions:
  contents: read
jobs:
  ab:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install -r requirements.txt
          pip uninstall -y finance-datareader || true
      - name: Run baseline and entry-anchor variant
        run: |
          python Daily_bot/backtest/replay_refill_threshold.py \
            --logs-dir Daily_bot/logs \
            --refill-min-expected-return 0.90 \
            --sell-tick-offset 1 \
            --out Daily_bot/backtest/results/entry_anchor_baseline.csv

          python Daily_bot/backtest/replay_refill_threshold.py \
            --logs-dir Daily_bot/logs \
            --refill-min-expected-return 0.90 \
            --sell-tick-offset 1 \
            --entry-anchor-stop-threshold -0.5 \
            --entry-anchor-stop-consecutive 3 \
            --out Daily_bot/backtest/results/entry_anchor_variant.csv

          python - <<'PY'
          import csv
          from collections import Counter
          from pathlib import Path
          FEE=0.00015
          TAX=0.0018

          def load_csv(path):
              return list(csv.DictReader(Path(path).open(encoding='utf-8-sig', newline='')))

          def stats(label):
              tp=Path(f'Daily_bot/backtest/results/entry_anchor_{label}.csv')
              dp=Path(f'Daily_bot/backtest/results/entry_anchor_{label}_daily_rev.csv')
              rows=load_csv(tp)
              gross=[float(r['pnl_percent']) for r in rows]
              net=[]
              net_amt=[]
              for r in rows:
                  buy=float(r['buy_amount_krw'])
                  sell=float(r['sell_amount_krw'])
                  pnl=sell-buy-buy*FEE-sell*FEE-sell*TAX
                  net_amt.append(pnl)
                  net.append((pnl/buy*100) if buy else 0.0)
              gw=[x for x in gross if x>0]
              gl=[x for x in gross if x<=0]
              nw=[x for x in net if x>0]
              nl=[x for x in net if x<=0]
              drows=load_csv(dp)
              daily=[float(r['total_return_percent_on_starting_capital']) for r in drows]
              equity=1.0; peak=1.0; mdd=0.0
              for x in daily:
                  equity*=1+x/100
                  peak=max(peak,equity)
                  mdd=min(mdd,(equity/peak-1)*100)
              out={
                  'trades':len(rows),
                  'gross_wins':len(gw),'gross_losses':len(gl),
                  'gross_win_rate':len(gw)/len(rows)*100 if rows else 0,
                  'gross_avg_win':sum(gw)/len(gw) if gw else 0,
                  'gross_avg_loss':sum(gl)/len(gl) if gl else 0,
                  'gross_payoff':(sum(gw)/len(gw))/abs(sum(gl)/len(gl)) if gw and gl and sum(gl) else 0,
                  'gross_avg_trade':sum(gross)/len(gross) if gross else 0,
                  'net_wins':len(nw),'net_losses':len(nl),
                  'net_win_rate':len(nw)/len(rows)*100 if rows else 0,
                  'net_avg_win':sum(nw)/len(nw) if nw else 0,
                  'net_avg_loss':sum(nl)/len(nl) if nl else 0,
                  'net_payoff':(sum(nw)/len(nw))/abs(sum(nl)/len(nl)) if nw and nl and sum(nl) else 0,
                  'net_avg_trade':sum(net)/len(net) if net else 0,
                  'net_profit_krw':round(sum(float(r['total_profit_krw']) for r in drows)),
                  'compounded_daily_return':(equity-1)*100,
                  'mdd':mdd,
                  'exit_reasons':dict(Counter(r['exit_reason'] for r in rows)),
              }
              print('RESULT',label,out)
              worst=sorted(rows,key=lambda r:float(r['pnl_percent']))[:5]
              for r in worst:
                  print('WORST',label,r['session_date'],r['ticker'],r['pnl_percent'],r['exit_reason'],r['entry_time'],r['exit_time'])
              return out
          b=stats('baseline')
          v=stats('variant')
          print('DELTA', {k:(v[k]-b[k]) for k in ['trades','gross_win_rate','gross_avg_trade','net_win_rate','net_avg_trade','net_profit_krw','compounded_daily_return','mdd']})
          PY
