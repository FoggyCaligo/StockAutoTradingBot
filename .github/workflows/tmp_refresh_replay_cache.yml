name: Temporary refresh replay cache
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp_refresh_replay_cache.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch replay cache refresh and README
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('Daily_bot/backtest/replay_db_builder.py')
          s = p.read_text(encoding='utf-8')
          old = '''def resolve_replay_db_path(db_path: Path, logs_dir: Path | None = None) -> Path:\n    requested_db_path = Path(db_path)\n\n    if requested_db_path in LEGACY_REPLAY_DB_PATHS:\n        if has_replay_source_data(CANONICAL_REPLAY_DB_PATH):\n            return CANONICAL_REPLAY_DB_PATH\n        resolved_logs_dir = Path(logs_dir) if logs_dir is not None else DEFAULT_REPLAY_LOGS_DIR\n        return build_replay_db_from_logs(resolved_logs_dir, CANONICAL_REPLAY_DB_PATH)\n\n    if has_replay_source_data(requested_db_path):\n        return requested_db_path\n\n    resolved_logs_dir = Path(logs_dir) if logs_dir is not None else requested_db_path.parent / "logs"\n    cache_db_path = resolved_logs_dir.parent / "backtest" / "cache" / f"{requested_db_path.stem}_replay_from_logs.sqlite3"\n    return build_replay_db_from_logs(resolved_logs_dir, cache_db_path)\n'''
          new = '''def resolve_replay_db_path(db_path: Path, logs_dir: Path | None = None) -> Path:\n    requested_db_path = Path(db_path)\n\n    # An explicitly supplied logs directory means the caller wants the replay to\n    # reflect the current CSV set. Rebuild from every market_traces_*.csv instead\n    # of trusting a potentially stale cache from an earlier run.\n    if logs_dir is not None:\n        resolved_logs_dir = Path(logs_dir)\n        if requested_db_path in LEGACY_REPLAY_DB_PATHS:\n            return build_replay_db_from_logs(resolved_logs_dir, CANONICAL_REPLAY_DB_PATH)\n        cache_db_path = resolved_logs_dir.parent / "backtest" / "cache" / f"{requested_db_path.stem}_replay_from_logs.sqlite3"\n        return build_replay_db_from_logs(resolved_logs_dir, cache_db_path)\n\n    if requested_db_path in LEGACY_REPLAY_DB_PATHS:\n        if has_replay_source_data(CANONICAL_REPLAY_DB_PATH):\n            return CANONICAL_REPLAY_DB_PATH\n        return build_replay_db_from_logs(DEFAULT_REPLAY_LOGS_DIR, CANONICAL_REPLAY_DB_PATH)\n\n    if has_replay_source_data(requested_db_path):\n        return requested_db_path\n\n    resolved_logs_dir = requested_db_path.parent / "logs"\n    cache_db_path = resolved_logs_dir.parent / "backtest" / "cache" / f"{requested_db_path.stem}_replay_from_logs.sqlite3"\n    return build_replay_db_from_logs(resolved_logs_dir, cache_db_path)\n'''
          if old not in s:
              raise SystemExit('resolve_replay_db_path target not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          p = Path('Daily_bot/README.md')
          s = p.read_text(encoding='utf-8')
          anchor = '''현재 설정을 모두 명시한 표준 실행 예시는 다음과 같다. 아래 값들은 **현재 기본값/실거래 대응값을 일부러 전부 적어 둔 것**이므로, 실험할 때는 바꾸려는 옵션만 수정하면 된다.\n'''
          replacement = anchor + '''\n`--logs-dir Daily_bot/logs`를 명시하면 백테스트 시작 시 기존 replay cache를 재사용하지 않고, 그 시점에 존재하는 `market_traces_*.csv` 전체를 다시 읽어 replay DB를 재생성한다. 따라서 이후 거래일의 market trace 파일이 추가되어도 아래 표준 커맨드를 그대로 다시 실행하면 새 로그까지 자동 포함된다. 별도로 cache DB를 삭제할 필요는 없다.\n'''
          if anchor not in s:
              raise SystemExit('README anchor not found')
          p.write_text(s.replace(anchor, replacement, 1), encoding='utf-8')
          PY
          python -m py_compile Daily_bot/backtest/replay_db_builder.py
          git config user.name FoggyCaligo
          git config user.email 136309172+FoggyCaligo@users.noreply.github.com
          git add Daily_bot/backtest/replay_db_builder.py Daily_bot/README.md
          git commit -m "Refresh replay DB when logs directory is explicit"
          git push origin HEAD:main
