name: Temporary run sell offset A/B
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp_run_sell_offset_ab.yml'
permissions:
  contents: read
jobs:
  ab:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install -r requirements.txt
          pip uninstall -y finance-datareader || true
      - name: Run live-equivalent A/B
        run: |
          python Daily_bot/backtest/compare_sell_tick_offset.py \
            --logs-dir Daily_bot/logs \
            --show-raw
