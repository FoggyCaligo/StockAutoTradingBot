name: Repair replay and run decay sweep

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repair_and_decay_sweep.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-and-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore replay and fix zero-decay config defaults
        run: |
          git show 43bf4f4dfcde9ab0164850eab701cc6982844bd1:Daily_bot/backtest/replay_market_traces.py > Daily_bot/backtest/replay_market_traces.py
          python - <<'PY'
          from pathlib import Path
          p = Path('Daily_bot/backtest/replay_market_traces.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('default=float(strategy_cfg.get("orderbook_bid_linear_decay_min_weight", 1.0) or 1.0),', 'default=float(strategy_cfg.get("orderbook_bid_linear_decay_min_weight", 1.0)),')
          s = s.replace('default=float(strategy_cfg.get("orderbook_ask_linear_decay_min_weight", 1.0) or 1.0),', 'default=float(strategy_cfg.get("orderbook_ask_linear_decay_min_weight", 1.0)),')
          p.write_text(s, encoding='utf-8')
          PY
          python -m py_compile Daily_bot/backtest/replay_market_traces.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Daily_bot/backtest/replay_market_traces.py
          git commit -m "Fix replay zero orderbook decay defaults"
          git push
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip uninstall -y finance-datareader
      - name: Run decay sweep
        run: |
          for w in 0.0 0.05 0.1 0.2; do
            label=$(echo "$w" | tr '.' '_')
            python Daily_bot/backtest/replay_refill_threshold.py \
              --logs-dir Daily_bot/logs \
              --refill-min-expected-return 0.90 \
              --stop-buy-time 11:30 \
              --orderbook-bid-linear-decay-min-weight "$w" \
              --orderbook-ask-linear-decay-min-weight "$w" \
              --out "Daily_bot/backtest/results/decay_${label}.csv"
          done
      - name: Print comparison
        run: |
          python - <<'PY'
          import csv
          from collections import Counter
          from pathlib import Path
          root = Path('Daily_bot/backtest/results')
          for label, w in [('0_0','0.00'),('0_05','0.05'),('0_1','0.10'),('0_2','0.20')]:
              p = root / f'decay_{label}.csv'
              d = p.with_name(p.stem + '_daily_rev.csv')
              with p.open(encoding='utf-8-sig', newline='') as f:
                  trades = list(csv.DictReader(f))
              with d.open(encoding='utf-8-sig', newline='') as f:
                  daily = list(csv.DictReader(f))
              wins = sum(float(r['pnl_percent']) > 0 for r in trades)
              net = sum(int(float(r['total_profit_krw'])) for r in daily)
              rets = [float(r['total_return_percent_on_starting_capital']) for r in daily]
              eq = peak = 1.0
              mdd = 0.0
              for r in rets:
                  eq *= 1 + r / 100
                  peak = max(peak, eq)
                  mdd = min(mdd, eq / peak - 1)
              print(f'DECAY {w} trades={len(trades)} wins={wins} win_rate={(wins/len(trades)*100 if trades else 0):.4f}% net_profit_krw={net} compounded_return={(eq-1)*100:.4f}% mdd={mdd*100:.4f}% reasons={dict(sorted(Counter(r["exit_reason"] for r in trades).items()))}')
              for r in daily:
                  print('DAY', w, r['session_date'], r['total_profit_krw'], r['total_return_percent_on_starting_capital'], r['total_buy_amount_krw'])
          PY
