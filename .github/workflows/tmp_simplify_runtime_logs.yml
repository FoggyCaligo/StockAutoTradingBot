name: Temporary simplify runtime logs
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp_simplify_runtime_logs.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Simplify runtime log outputs
        run: |
          python - <<'PY'
          from pathlib import Path
          import csv

          p = Path('Daily_bot/storage/db.py')
          s = p.read_text(encoding='utf-8')

          old = '''    def _run_csv(self, context: str, operation) -> bool:\n        if not self._csv_enabled:\n            return False\n        try:\n            operation()\n            return True\n        except Exception as exc:\n            self._disable_csv_sink(context, exc)\n            return False\n'''
          new = '''    def _run_csv(self, context: str, operation) -> bool:\n        # Runtime CSV policy: keep only market traces and daily confirmed fills.\n        allowed = (\n            context == "save_market_trace"\n            or context == "save_fill"\n            or context.startswith("rebuild_session_fill_exports")\n        )\n        if not allowed or not self._csv_enabled:\n            return False\n        try:\n            operation()\n            return True\n        except Exception as exc:\n            self._disable_csv_sink(context, exc)\n            return False\n'''
          if old not in s:
              raise SystemExit('missing _run_csv target')
          s = s.replace(old, new, 1)

          old = '''    def _run_audit(self, context: str, operation) -> bool:\n        if not self._audit_enabled:\n            return False\n        try:\n            operation()\n            return True\n        except Exception as exc:\n            self._disable_audit_sink(context, exc)\n            return False\n'''
          new = '''    def _run_audit(self, context: str, operation) -> bool:\n        # Detailed audit CSV exports were retired in favor of fills_YYYYMMDD.csv.\n        return False\n'''
          if old not in s:
              raise SystemExit('missing _run_audit target')
          s = s.replace(old, new, 1)

          old = '''        self._run_csv(\n            "save_fill",\n            lambda: self._append_csv_row(\n                self._daily_csv_path("fills"),\n                ["broker_order_id", "ticker", "side", "quantity", "price", "filled_at", "source", "raw_json"],\n                {\n                    "broker_order_id": fill.order_id,\n                    "ticker": fill.ticker,\n                    "side": side_upper,\n                    "quantity": fill.quantity,\n                    "price": fill.price,\n                    "filled_at": filled_at,\n                    "source": source,\n                    "raw_json": raw_json,\n                },\n            ),\n        )\n'''
          new = '''        # Keep the public daily fill CSV restricted to broker-confirmed executions.\n        # Reconciliation-only inferred fills remain available internally in SQLite.\n        if "reconciliation" not in str(source or "").lower():\n            self._run_csv(\n                "save_fill",\n                lambda: self._append_csv_row(\n                    self._daily_csv_path("fills"),\n                    ["broker_order_id", "ticker", "side", "quantity", "price", "filled_at", "source", "raw_json"],\n                    {\n                        "broker_order_id": fill.order_id,\n                        "ticker": fill.ticker,\n                        "side": side_upper,\n                        "quantity": fill.quantity,\n                        "price": fill.price,\n                        "filled_at": filled_at,\n                        "source": source,\n                        "raw_json": raw_json,\n                    },\n                ),\n            )\n'''
          if old not in s:
              raise SystemExit('missing save_fill csv target')
          s = s.replace(old, new, 1)

          old = '''        for row in fill_rows:\n            self._run_csv(\n                "rebuild_session_fill_exports write fills csv",\n'''
          new = '''        for row in fill_rows:\n            if "reconciliation" in str(row.get("source") or "").lower():\n                continue\n            self._run_csv(\n                "rebuild_session_fill_exports write fills csv",\n'''
          if old not in s:
              raise SystemExit('missing rebuild fills loop target')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('Daily_bot/broker/kiwoom_client.py')
          s = p.read_text(encoding='utf-8')
          old = '''        orderable_cash = self._extract_orderable_cash(raw)\n        self._log_orderable_cash_debug(raw, orderable_cash)\n        return orderable_cash\n'''
          new = '''        orderable_cash = self._extract_orderable_cash(raw)\n        return orderable_cash\n'''
          if old not in s:
              raise SystemExit('missing cash debug call target')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          # Remove inferred reconciliation rows from the retained historical fill CSVs.
          for path in Path('Daily_bot/logs').glob('fills_*.csv'):
              with path.open('r', newline='', encoding='utf-8-sig') as fp:
                  rows = list(csv.DictReader(fp))
              if not rows:
                  continue
              fieldnames = list(rows[0].keys())
              kept = [r for r in rows if 'reconciliation' not in str(r.get('source') or '').lower()]
              with path.open('w', newline='', encoding='utf-8-sig') as fp:
                  writer = csv.DictWriter(fp, fieldnames=fieldnames)
                  writer.writeheader()
                  writer.writerows(kept)

          p = Path('Daily_bot/README.md')
          s = p.read_text(encoding='utf-8')
          anchor = '## 현재 전략과 맞춘 백테스트\n'
          block = '''## 런타임 로그 파일 정책\n\n실거래 실행 시 `Daily_bot/logs`에 지속적으로 남기는 기록은 다음 3종으로 제한한다.\n\n- `market_traces_YYYYMMDD.csv`: 백테스트/판정 재현용 시장 trace\n- `fills_YYYYMMDD.csv`: 브로커에서 실제 체결이 확인된 BUY/SELL만 기록. reconciliation 추정 fill은 CSV에서 제외\n- `run_real_YYYYMMDD_HHMMSS.log`: 해당 실거래 세션의 콘솔 실행 로그\n\n`account_traces_*`, `daily_reference_prices_*`, `orders_*`, `daily_rev.csv`, `trade_fills_audit*.csv`, `kt00001_cash_debug_*` 같은 별도 런타임 파일은 더 이상 생성하지 않는다. 필요한 내부 상태는 SQLite에 유지하므로 거래 로직 자체는 그대로 동작한다.\n\n'''
          if anchor not in s:
              raise SystemExit('README log-policy anchor missing')
          if '## 런타임 로그 파일 정책' not in s:
              s = s.replace(anchor, block + anchor, 1)
          p.write_text(s, encoding='utf-8')
          PY

          # Keep only the three requested persisted runtime log families.
          python - <<'PY'
          from pathlib import Path
          import subprocess
          root = Path('Daily_bot/logs')
          for path in root.iterdir():
              if not path.is_file():
                  continue
              name = path.name
              keep = (
                  (name.startswith('market_traces_') and name.endswith('.csv'))
                  or (name.startswith('fills_') and name.endswith('.csv'))
                  or (name.startswith('run_real_') and name.endswith('.log'))
              )
              if not keep:
                  subprocess.run(['git', 'rm', '-f', str(path)], check=True)
          PY

          python -m py_compile Daily_bot/storage/db.py Daily_bot/broker/kiwoom_client.py
          git config user.name FoggyCaligo
          git config user.email 136309172+FoggyCaligo@users.noreply.github.com
          git add Daily_bot/storage/db.py Daily_bot/broker/kiwoom_client.py Daily_bot/README.md Daily_bot/logs
          git commit -m "Reduce runtime logs to traces fills and session logs"
          git push origin HEAD:main
