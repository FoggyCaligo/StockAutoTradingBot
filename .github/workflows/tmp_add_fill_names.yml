name: Temporary add fill names
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp_add_fill_names.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add stock names to daily fills CSV
        run: |
          python - <<'PY'
          from pathlib import Path
          import csv, json

          p = Path('Daily_bot/storage/db.py')
          s = p.read_text(encoding='utf-8')

          anchor = '''    def _persist_fill(\n'''
          helper = '''    @staticmethod\n    def _resolve_fill_name(fill: Fill) -> str:\n        raw = fill.raw if isinstance(fill.raw, dict) else {}\n        candidates = []\n        latest = raw.get("latest_row") if isinstance(raw, dict) else None\n        if isinstance(latest, dict):\n            candidates.append(latest)\n        rows = raw.get("rows") if isinstance(raw, dict) else None\n        if isinstance(rows, list):\n            candidates.extend(row for row in rows if isinstance(row, dict))\n        nested = raw.get("raw") if isinstance(raw, dict) else None\n        if isinstance(nested, dict):\n            nested_latest = nested.get("latest_row")\n            if isinstance(nested_latest, dict):\n                candidates.append(nested_latest)\n            nested_rows = nested.get("rows")\n            if isinstance(nested_rows, list):\n                candidates.extend(row for row in nested_rows if isinstance(row, dict))\n        for row in candidates:\n            name = str(row.get("stk_nm") or row.get("name") or "").strip()\n            if name:\n                return name\n        return ""\n\n'''
          if helper not in s:
              if anchor not in s:
                  raise SystemExit('persist anchor not found')
              s = s.replace(anchor, helper + anchor, 1)

          s = s.replace(
              '["broker_order_id", "ticker", "side", "quantity", "price", "filled_at", "source", "raw_json"]',
              '["broker_order_id", "ticker", "name", "side", "quantity", "price", "filled_at", "source", "raw_json"]'
          )
          s = s.replace(
              '"ticker": fill.ticker,\n                        "side": side_upper,',
              '"ticker": fill.ticker,\n                        "name": self._resolve_fill_name(fill),\n                        "side": side_upper,'
          )
          s = s.replace(
              'fill_fieldnames = ["broker_order_id", "ticker", "side", "quantity", "price", "filled_at", "source", "raw_json"]',
              'fill_fieldnames = ["broker_order_id", "ticker", "name", "side", "quantity", "price", "filled_at", "source", "raw_json"]'
          )
          s = s.replace(
              '"ticker": row["ticker"],\n                        "side": row["side"],',
              '"ticker": row["ticker"],\n                        "name": self._resolve_fill_name(Fill(order_id=str(row["broker_order_id"] or ""), ticker=str(row["ticker"] or ""), quantity=int(row["quantity"] or 0), price=int(row["price"] or 0), filled_at=datetime.fromisoformat(str(row["filled_at"])), raw=json.loads(row["raw_json"]) if row["raw_json"] else None)),\n                        "side": row["side"],'
          )
          p.write_text(s, encoding='utf-8')

          # Rewrite retained historical fills with a name column using raw_json.
          def resolve_name(raw_text):
              try:
                  raw = json.loads(raw_text) if raw_text else {}
              except Exception:
                  return ''
              candidates=[]
              if isinstance(raw, dict):
                  if isinstance(raw.get('latest_row'), dict): candidates.append(raw['latest_row'])
                  if isinstance(raw.get('rows'), list): candidates += [r for r in raw['rows'] if isinstance(r, dict)]
                  nested=raw.get('raw')
                  if isinstance(nested, dict):
                      if isinstance(nested.get('latest_row'), dict): candidates.append(nested['latest_row'])
                      if isinstance(nested.get('rows'), list): candidates += [r for r in nested['rows'] if isinstance(r, dict)]
              for r in candidates:
                  name=str(r.get('stk_nm') or r.get('name') or '').strip()
                  if name: return name
              return ''

          for path in Path('Daily_bot/logs').glob('fills_*.csv'):
              with path.open('r', newline='', encoding='utf-8-sig') as fp:
                  rows=list(csv.DictReader(fp))
              if not rows:
                  continue
              fieldnames=['broker_order_id','ticker','name','side','quantity','price','filled_at','source','raw_json']
              with path.open('w', newline='', encoding='utf-8-sig') as fp:
                  w=csv.DictWriter(fp, fieldnames=fieldnames)
                  w.writeheader()
                  for row in rows:
                      row['name']=row.get('name') or resolve_name(row.get('raw_json',''))
                      w.writerow({k: row.get(k,'') for k in fieldnames})

          p = Path('Daily_bot/README.md')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              '`fills_YYYYMMDD.csv`: 브로커에서 실제 체결이 확인된 BUY/SELL만 기록. reconciliation 추정 fill은 CSV에서 제외',
              '`fills_YYYYMMDD.csv`: 브로커에서 실제 체결이 확인된 BUY/SELL만 기록하며 `ticker`와 종목명 `name`을 함께 저장. reconciliation 추정 fill은 CSV에서 제외'
          )
          p.write_text(s, encoding='utf-8')
          PY
          python -m py_compile Daily_bot/storage/db.py
          git config user.name FoggyCaligo
          git config user.email 136309172+FoggyCaligo@users.noreply.github.com
          git add Daily_bot/storage/db.py Daily_bot/README.md Daily_bot/logs/fills_*.csv
          git commit -m "Add stock names to daily fill logs"
          git push origin HEAD:main
